<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFViewer マイク詳細</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

  <div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

  <main class="max-w-md mx-auto px-4 py-6 space-y-4" x-data="microphoneDetail()" x-init="init()">
    <p x-show="loading" class="text-sm text-gray-500">読み込み中...</p>
    <p x-show="errorMessage" x-text="errorMessage" class="text-sm text-red-600"></p>

    <template x-if="!loading && head">
      <div class="space-y-4">
        <div class="flex items-center justify-between">
          <h1 class="text-xl font-bold" x-text="head.management_number"></h1>
          <div class="flex gap-2" x-show="isAdmin">
            <a :href="`./microphone-edit.html?id=${head.id}`"
               class="bg-gray-800 text-white rounded px-3 py-2 text-sm">編集</a>
            <button @click="remove" class="bg-red-600 text-white rounded px-3 py-2 text-sm">削除</button>
          </div>
        </div>

        <div class="bg-white rounded-lg shadow p-4 grid grid-cols-1 gap-3 text-sm">
          <div>
            <div class="text-gray-500">メーカー</div>
            <div x-text="head.manufacturer || '-'"></div>
          </div>
          <div>
            <div class="text-gray-500">型番</div>
            <div x-text="head.model || '-'"></div>
          </div>
          <div>
            <div class="text-gray-500">シリアル</div>
            <div x-text="head.serial_number || '-'"></div>
          </div>
          <div>
            <div class="text-gray-500">状態</div>
            <div x-text="statusLabel(head.status)"></div>
          </div>
          <div>
            <div class="text-gray-500">備考</div>
            <div class="whitespace-pre-wrap" x-text="head.note || '-'"></div>
          </div>
        </div>

        <div>
          <h2 class="text-lg font-bold mb-3">測定履歴</h2>

          <div class="space-y-3">
            <template x-for="measurement in measurements" :key="measurement.id">
              <div class="bg-white rounded-lg shadow p-4">
                <div class="flex items-center justify-between">
                  <span class="font-medium" x-text="measurement.measurement_name"></span>
                  <span class="text-xs text-gray-500" x-text="measurement.measured_at"></span>
                </div>
                <div class="text-sm text-gray-600 mt-1" x-text="measurement.measurement_types?.name ?? '-'"></div>
                <div class="text-sm text-gray-500 mt-1" x-text="measurement.note || ''"></div>
                <a :href="`./compare.html?measurement=${measurement.id}`"
                   class="inline-block mt-2 text-blue-600 hover:underline text-sm">比較へ追加</a>
              </div>
            </template>
            <p x-show="measurements.length === 0" class="text-sm text-gray-500 text-center py-4">測定履歴はまだありません。</p>
          </div>
        </div>
      </div>
    </template>
  </main>

  <script type="module">
    import { initAuthenticatedPage } from './assets/js/layout.js';
    import { getMicrophoneHead, listMeasurementsForHead, softDeleteMicrophoneHead, statusLabel } from './assets/js/microphones.js';

    window.microphoneDetail = function () {
      return {
        head: null,
        measurements: [],
        isAdmin: false,
        loading: true,
        errorMessage: '',
        statusLabel,
        async init() {
          const result = await initAuthenticatedPage();
          this.isAdmin = result?.profile?.role === 'administrator';

          const id = new URLSearchParams(window.location.search).get('id');
          if (!id) {
            this.errorMessage = 'マイクが指定されていません。';
            this.loading = false;
            return;
          }

          try {
            this.head = await getMicrophoneHead(id);
            this.measurements = await listMeasurementsForHead(id);
          } catch (error) {
            console.error(error);
            this.errorMessage = 'マイク情報の取得に失敗しました。';
          } finally {
            this.loading = false;
          }
        },
        async remove() {
          if (!confirm(`${this.head.management_number} を削除しますか？（論理削除のため復元可能です）`)) {
            return;
          }
          try {
            await softDeleteMicrophoneHead(this.head.id);
            window.location.href = './microphones.html';
          } catch (error) {
            console.error(error);
            alert('削除に失敗しました。');
          }
        }
      };
    };
  </script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
