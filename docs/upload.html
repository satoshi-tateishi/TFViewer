<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFViewer アップロード</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

  <div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

  <main class="max-w-md mx-auto px-4 py-6 space-y-4" x-data="uploadForm()" x-init="init()">
    <h1 class="text-xl font-bold">アップロード</h1>
    <p class="text-sm text-gray-600">
      TRF/CSVファイルをドラッグ&ドロップ、またはタップして選択してください。
      同じファイル名の測定は自動的に上書きされます。
    </p>

    <div
      class="border-2 border-dashed rounded-lg p-8 text-center text-sm text-gray-500 bg-white"
      :class="isDragging ? 'border-blue-500 bg-blue-50' : 'border-gray-300'"
      @dragover.prevent="isDragging = true"
      @dragleave.prevent="isDragging = false"
      @drop.prevent="onDrop"
      @click="$refs.fileInput.click()"
    >
      <p x-show="!processing">タップしてファイルを選択、またはドラッグ&ドロップ</p>
      <p x-show="processing">取り込み中...</p>
      <input type="file" accept=".trf,.csv" multiple x-ref="fileInput" class="hidden" @change="onFileSelected">
    </div>

    <div class="space-y-2" x-show="results.length > 0">
      <template x-for="(result, index) in results" :key="index">
        <div class="bg-white rounded-lg shadow p-3 text-sm">
          <div class="flex items-center justify-between">
            <span class="font-medium truncate" x-text="result.fileName"></span>
            <span
              class="text-xs rounded px-2 py-1 shrink-0"
              :class="result.ok ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'"
              x-text="result.status"
            ></span>
          </div>
          <div class="text-xs text-gray-500 mt-1" x-show="result.ok" x-text="`${result.measurementName} / ${result.pointCount}点`"></div>
          <div class="text-xs text-amber-600 mt-1" x-show="result.ok && result.status === '上書き'"
               x-text="`上書き前: ${result.previousMeasurementName}（${result.previousUpdatedAt} 更新）`"></div>
          <div class="text-xs text-red-600 mt-1" x-show="!result.ok" x-text="result.message"></div>
        </div>
      </template>
    </div>

    <a href="./measurements.html" class="block text-center text-blue-600 hover:underline text-sm">一覧を見る</a>
  </main>

  <script type="module">
    import { uploadForm } from './assets/js/pages/upload.js';
    window.uploadForm = uploadForm;
  </script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
