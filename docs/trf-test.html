<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFViewer TRF解析テスト</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

  <div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

  <main class="max-w-md mx-auto px-4 py-6 space-y-4" x-data="trfTest()" x-init="init()">
    <h1 class="text-xl font-bold">TRF解析テスト（Phase 5確認用）</h1>

    <div class="bg-white rounded-lg shadow p-4 space-y-3">
      <div>
        <label class="block text-xs font-medium mb-1">TRFファイル</label>
        <input type="file" accept=".trf" @change="onFileSelected" class="w-full text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium mb-1">平滑化</label>
        <select x-model.number="fraction" @change="resmooth" class="w-full border rounded px-2 py-2 text-sm">
          <option value="1">1/1 oct</option>
          <option value="3">1/3 oct</option>
          <option value="6">1/6 oct</option>
          <option value="12">1/12 oct</option>
          <option value="24">1/24 oct</option>
        </select>
      </div>
    </div>

    <p x-show="loading" class="text-sm text-gray-500">解析中...</p>
    <p x-show="errorMessage" x-text="errorMessage" class="text-sm text-red-600"></p>

    <template x-if="result">
      <div class="space-y-4">
        <div class="bg-white rounded-lg shadow p-4 text-sm space-y-1">
          <div><span class="text-gray-500">測定名: </span><span x-text="result.measurementName"></span></div>
          <div><span class="text-gray-500">元ファイル: </span><span x-text="result.sourceFileName"></span></div>
          <div><span class="text-gray-500">格納点数: </span><span x-text="result.storedPointCount"></span></div>
          <div><span class="text-gray-500">有効点数: </span><span x-text="result.rows.length"></span></div>
        </div>

        <div id="trf-chart" class="w-full bg-white rounded-lg shadow p-2" style="height: 280px;"></div>
      </div>
    </template>
  </main>

  <script type="module">
    import { trfTest } from './assets/js/pages/trf-test.js';
    window.trfTest = trfTest;
  </script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
