<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFViewer 測定一覧</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

  <div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

  <main class="max-w-md mx-auto px-4 py-6 space-y-4" x-data="measurementList()" x-init="init()">
    <h1 class="text-xl font-bold">測定一覧</h1>

    <div class="bg-white rounded-lg shadow p-4">
      <label class="block text-xs font-medium mb-1">平滑化（全体設定）</label>
      <select x-model.number="fraction" @change="onFractionChange" class="w-full border rounded px-2 py-2 text-sm">
        <option value="1">1/1 oct</option>
        <option value="3">1/3 oct</option>
        <option value="6">1/6 oct</option>
        <option value="12">1/12 oct</option>
        <option value="24">1/24 oct</option>
      </select>
    </div>

    <div id="compare-chart" class="w-full bg-white rounded-lg shadow p-2" style="height: 280px;"></div>

    <p x-show="loading" class="text-sm text-gray-500">読み込み中...</p>
    <p x-show="errorMessage" x-text="errorMessage" class="text-sm text-red-600"></p>

    <div id="measurement-list" class="space-y-2">
      <template x-for="(measurement, index) in measurements" :key="measurement.id">
        <div class="relative bg-white rounded-lg shadow p-3 flex items-center gap-3">
          <span class="absolute top-1 right-2 text-[10px] leading-none text-gray-400" x-text="formatUpdatedAt(measurement.updated_at)"></span>
          <div x-show="canReorder" class="flex flex-col shrink-0 -my-2">
            <button type="button" :disabled="index === 0" @click="move(index, -1)" aria-label="上へ" class="text-gray-400 disabled:opacity-20 w-8 h-8 flex items-center justify-center leading-none">▲</button>
            <button type="button" :disabled="index === measurements.length - 1" @click="move(index, 1)" aria-label="下へ" class="text-gray-400 disabled:opacity-20 w-8 h-8 flex items-center justify-center leading-none">▼</button>
          </div>
          <div class="flex items-center gap-3 flex-1 min-w-0" :class="checked[measurement.id] ? '' : 'grayscale opacity-50'">
            <span class="w-3 h-3 rounded-full shrink-0" :style="swatchStyle(index)"></span>
            <input type="checkbox" :checked="checked[measurement.id]" @change="toggle(measurement.id)" class="w-5 h-5 shrink-0">
            <div class="flex-1 min-w-0" @click="toggle(measurement.id)">
              <div class="font-medium truncate" x-text="measurement.file_name"></div>
              <div class="text-xs text-gray-500 truncate" x-text="measurement.measurement_name"></div>
            </div>
          </div>
          <button type="button" x-show="isAdmin" @click="remove(measurement)" class="text-red-600 text-xs shrink-0">削除</button>
        </div>
      </template>
    </div>
    <p x-show="!loading && measurements.length === 0" class="text-sm text-gray-500 text-center py-4">
      測定データがありません。アップロードしてください。
    </p>
  </main>

  <script type="module">
    import { measurementList } from './assets/js/pages/measurement-list.js';
    window.measurementList = measurementList;
  </script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</body>
</html>
