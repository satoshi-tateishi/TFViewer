<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFViewer 測定一覧</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="assets/css/styles.css">
<script src="https://unpkg.com/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous"></script>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js" integrity="sha384-cCVCZkAjYNxaYKbM8lsArLznDF/SvMFr1jcZrvOpSTCa0W40ZAdLzHCEulnUa5i7" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.7/Sortable.min.js" integrity="sha384-DgmC6Xe2bSN2WjTDXzWYbUbxyhNP+NNkGDR/g78pCXV7E7rcVTGxVg0uIVCUUcBc" crossorigin="anonymous"></script>
</head>
<body class="min-h-screen bg-gray-50 text-gray-900">

  <div id="nav-placeholder" hx-get="partials/nav.html" hx-trigger="load" hx-swap="innerHTML"></div>

  <main class="max-w-md md:max-w-4xl mx-auto px-4 py-6 space-y-4" x-data="measurementList()" x-init="init()">
    <h1 class="text-xl font-bold">測定一覧</h1>

    <div class="md:grid md:grid-cols-2 md:gap-4 space-y-4 md:space-y-0">
      <div class="bg-white rounded-lg shadow p-4">
        <label class="block text-xs font-medium mb-1">平滑化（全体設定）</label>
        <select x-model.number="fraction" @change="onFractionChange" class="w-full border rounded px-2 py-2 text-sm">
          <option value="1">1/1 oct</option>
          <option value="3">1/3 oct</option>
          <option value="6">1/6 oct</option>
          <option value="12">1/12 oct</option>
          <option value="24">1/24 oct</option>
        </select>
      </div>

      <div class="bg-white rounded-lg shadow p-4">
        <label class="block text-xs font-medium mb-1">
          コヒーレンス閾値（全体設定）: <span x-text="coherenceThreshold.toFixed(2)"></span>
        </label>
        <input
          type="range"
          min="0"
          max="1"
          step="0.05"
          x-model.number="coherenceThreshold"
          @change="onCoherenceThresholdChange"
          class="w-full"
        >
      </div>
    </div>

    <div class="md:flex md:gap-2">
      <div class="hidden md:flex md:flex-col md:w-48 md:shrink-0 md:h-[420px] bg-white rounded-lg shadow p-2 gap-1 overflow-y-auto">
        <button
          type="button"
          x-show="checkedMeasurements().length > 0"
          @click="toggleDimAll()"
          class="sticky top-0 bg-white text-left text-[10px] text-blue-600 pb-1 mb-1 border-b shrink-0"
          x-text="allDimmed() ? 'すべて表示' : 'すべてグレーに'"
        ></button>
        <template x-for="measurement in checkedMeasurements()" :key="measurement.id">
          <div
            class="flex items-center gap-2 text-xs cursor-pointer select-none"
            :class="hiddenInChart[measurement.id] ? 'opacity-40 grayscale' : ''"
            @click="toggleChartVisibility(measurement)"
          >
            <span class="w-3 h-3 rounded-full shrink-0" :style="swatchStyle(measurement)"></span>
            <span class="truncate" x-text="measurement.file_name"></span>
          </div>
        </template>
        <p x-show="checkedMeasurements().length === 0" class="text-xs text-gray-400">表示中の測定なし</p>
      </div>
      <div id="compare-chart" class="w-full h-[280px] md:flex-1 md:min-w-0 md:h-[420px] bg-white rounded-lg shadow p-2"></div>
    </div>

    <div x-show="checkedMeasurements().length > 0" class="md:hidden flex flex-wrap gap-x-3 gap-y-1 bg-white rounded-lg shadow p-2">
      <button
        type="button"
        @click="toggleDimAll()"
        class="basis-full text-left text-[10px] text-blue-600"
        x-text="allDimmed() ? 'すべて表示' : 'すべてグレーに'"
      ></button>
      <template x-for="measurement in checkedMeasurements()" :key="measurement.id">
        <div
          class="flex items-center gap-1.5 text-xs max-w-full cursor-pointer select-none"
          :class="hiddenInChart[measurement.id] ? 'opacity-40 grayscale' : ''"
          @click="toggleChartVisibility(measurement)"
        >
          <span class="w-3 h-3 rounded-full shrink-0" :style="swatchStyle(measurement)"></span>
          <span class="truncate" x-text="measurement.file_name"></span>
        </div>
      </template>
    </div>

    <div class="bg-white rounded-lg shadow p-3">
      <div class="flex flex-wrap gap-x-4 gap-y-2">
        <template x-for="letter in letters" :key="letter">
          <label class="flex items-center gap-1.5 text-xs font-medium">
            <input
              type="checkbox"
              :checked="letterFilters.includes(letter)"
              @change="toggleLetter(letter)"
              class="w-4 h-4 shrink-0"
            >
            <span x-text="letter"></span>
          </label>
        </template>
      </div>
    </div>

    <div class="flex items-center gap-2">
      <div class="relative flex-1">
        <input
          type="text"
          x-model="searchQuery"
          placeholder='検索（スペース=AND、|=OR、"..."=完全一致）'
          class="w-full border rounded px-3 py-2 pr-9 text-sm bg-white"
        >
        <button
          type="button"
          x-show="searchQuery"
          @click="clearSearch"
          aria-label="検索クリア"
          class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 w-6 h-6 flex items-center justify-center leading-none"
        >✕</button>
      </div>
      <button
        type="button"
        @click="showSearchHelp = !showSearchHelp"
        aria-label="検索の書き方"
        class="shrink-0 w-8 h-8 rounded-full border text-gray-500 text-xs flex items-center justify-center"
        :class="showSearchHelp ? 'bg-gray-100' : ''"
      >?</button>
    </div>
    <p x-show="showSearchHelp" class="text-[10px] text-gray-500 -mt-2">
      スペース区切り=AND（例: A B）／ <code>|</code> 区切り=OR（例: A|B）／
      <code>"..."</code> で囲むとスペースを含む1語として扱う（例: "WS A" BU）
    </p>

    <div class="bg-white rounded-lg shadow p-4 space-y-2">
      <label class="flex items-center gap-2 text-xs font-medium">
        <input type="checkbox" x-model="bandFilterEnabled" class="w-4 h-4 shrink-0">
        帯域平均でフィルター
      </label>
      <div class="grid grid-cols-3 gap-2" :class="bandFilterEnabled ? '' : 'opacity-40 pointer-events-none'">
        <div>
          <label class="block text-[10px] text-gray-500 mb-0.5">下限(Hz)</label>
          <input type="number" x-model.number="bandLowFreq" class="w-full border rounded px-2 py-1 text-sm">
        </div>
        <div>
          <label class="block text-[10px] text-gray-500 mb-0.5">上限(Hz)</label>
          <input type="number" x-model.number="bandHighFreq" class="w-full border rounded px-2 py-1 text-sm">
        </div>
        <div>
          <label class="block text-[10px] text-gray-500 mb-0.5">閾値(dB以下)</label>
          <input type="number" x-model.number="bandThreshold" step="0.5" class="w-full border rounded px-2 py-1 text-sm">
        </div>
      </div>
    </div>

    <div class="flex items-center justify-between text-xs">
      <span class="text-gray-500" x-text="`${filteredMeasurements().length}/${measurements.length}件表示中`"></span>
      <div class="flex gap-3">
        <button type="button" @click="showFiltered" class="text-blue-600" x-text="isFiltering() ? '検索結果を表示' : 'すべて表示'"></button>
        <button type="button" x-show="isFiltering()" @click="hideFiltered" class="text-blue-600">検索結果を非表示</button>
        <button type="button" @click="hideAll" class="text-blue-600">すべて非表示</button>
      </div>
    </div>

    <p x-show="loading" class="text-sm text-gray-500">読み込み中...</p>
    <p x-show="errorMessage" x-text="errorMessage" class="text-sm text-red-600"></p>

    <div id="measurement-list" class="space-y-2">
      <template x-for="(measurement, index) in filteredMeasurements()" :key="measurement.id">
        <div class="relative bg-white rounded-lg shadow p-3 flex items-center gap-3" :data-id="measurement.id">
          <span class="absolute top-1 right-2 text-[10px] leading-none text-gray-400" x-text="formatUpdatedAt(measurement.updated_at)"></span>
          <div class="md:hidden flex flex-col shrink-0 -my-2">
            <button type="button" :disabled="!canReorder || isFiltering() || index === 0" @click="move(measurement, -1)" aria-label="上へ" class="text-gray-400 disabled:opacity-20 disabled:cursor-not-allowed w-8 h-8 flex items-center justify-center leading-none">▲</button>
            <button type="button" :disabled="!canReorder || isFiltering() || index === filteredMeasurements().length - 1" @click="move(measurement, 1)" aria-label="下へ" class="text-gray-400 disabled:opacity-20 disabled:cursor-not-allowed w-8 h-8 flex items-center justify-center leading-none">▼</button>
          </div>
          <span
            role="button"
            aria-label="並び替え"
            :class="(!canReorder || isFiltering()) ? 'opacity-20 cursor-not-allowed pointer-events-none' : 'cursor-grab'"
            class="hidden md:flex drag-handle shrink-0 text-gray-400 select-none w-8 h-8 items-center justify-center text-lg"
          >⠿</span>
          <div class="flex items-center gap-3 flex-1 min-w-0" :class="checked[measurement.id] ? '' : 'grayscale opacity-50'">
            <span x-show="!loadingIds[measurement.id]" class="w-3 h-3 rounded-full shrink-0" :style="swatchStyle(measurement)"></span>
            <span x-show="loadingIds[measurement.id]" class="w-3 h-3 rounded-full shrink-0 border-2 border-gray-300 border-t-blue-600 animate-spin"></span>
            <input type="checkbox" :checked="checked[measurement.id]" :disabled="!!loadingIds[measurement.id]" @change="toggle(measurement.id)" class="w-5 h-5 shrink-0 disabled:opacity-50">
            <div class="flex-1 min-w-0" @click="toggle(measurement.id)">
              <div class="font-medium truncate" x-text="measurement.file_name"></div>
              <div class="text-xs text-gray-500 truncate" x-text="measurement.measurement_name"></div>
            </div>
          </div>
          <button type="button" :disabled="!canDelete" @click="remove(measurement)" class="text-red-600 text-xs shrink-0 disabled:opacity-20 disabled:cursor-not-allowed">削除</button>
        </div>
      </template>
    </div>
    <p x-show="!loading && measurements.length === 0" class="text-sm text-gray-500 text-center py-4">
      測定データがありません。アップロードしてください。
    </p>
    <p x-show="!loading && measurements.length > 0 && filteredMeasurements().length === 0" class="text-sm text-gray-500 text-center py-4">
      該当する測定データがありません。
    </p>

    <button
      type="button"
      @click="scrollToChart"
      aria-label="グラフへ戻る"
      class="fixed bottom-6 right-6 w-12 h-12 rounded-full bg-blue-600 text-white shadow-lg flex items-center justify-center text-xl leading-none"
    >↑</button>

    <div x-show="pendingDelete" x-cloak class="fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-10">
      <div class="bg-white rounded-lg shadow-lg p-4 w-full max-w-xs space-y-3" @click.outside="cancelRemove">
        <p class="text-sm">
          <span class="font-medium break-all" x-text="pendingDelete?.file_name"></span> を削除しますか？
        </p>
        <div class="flex justify-end gap-2 text-sm">
          <button type="button" @click="cancelRemove" class="px-3 py-1.5 rounded border text-gray-600">キャンセル</button>
          <button type="button" @click="confirmRemove" class="px-3 py-1.5 rounded bg-red-600 text-white">削除</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module">
    import { measurementList } from './assets/js/pages/measurement-list.js';
    window.measurementList = measurementList;
  </script>
  <script defer src="https://unpkg.com/alpinejs@3.15.12/dist/cdn.min.js" integrity="sha384-pb6hrQvo4s23cEUFtj0CZkzGE3jyK3pj26RIupXXxhSrrcUA/Cn0lZgcCrGH0t6L" crossorigin="anonymous"></script>
</body>
</html>
